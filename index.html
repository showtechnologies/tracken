
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracken — Attrezzi in cantiere</title>
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="./manifest.webmanifest">

  <script src="./offline-db.js"></script>
  <style>
    button{min-height:44px;touch-action:manipulation} input,select,textarea{font-size:16px}
    :root{
      --bg:#f4f7fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --border:#dbe3ee;
      --primary:#1d4ed8; --primary-soft:#dbeafe; --ok:#166534; --ok-soft:#dcfce7;
      --warn:#92400e; --warn-soft:#fef3c7; --danger:#b91c1c; --danger-soft:#fee2e2; --info:#0f766e; --info-soft:#ccfbf1;
      --shadow:0 10px 30px rgba(15,23,42,.08); --r:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit}
    .app{max-width:1280px;margin:0 auto;padding:12px;padding-bottom:96px}
    .panel,.sidebar,.modal-card,.sticky-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
    .panel,.sidebar,.sticky-bar{padding:14px}
    .layout{display:grid;grid-template-columns:260px 1fr;gap:14px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .top h1,.top h2,.top h3{margin:0}
    .top p,.muted{color:var(--muted)} .small{font-size:.84rem}
    .actions{display:flex;flex-wrap:wrap;gap:8px} .grow{flex:1}
    .grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    button{border:1px solid var(--border);background:#fff;padding:11px 12px;border-radius:12px;cursor:pointer;min-height:44px}
    button:hover{transform:translateY(-1px)}
    .primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
    .ok{background:var(--ok-soft);border-color:#bbf7d0;color:var(--ok);font-weight:700}
    .warn{background:var(--warn-soft);border-color:#fde68a;color:var(--warn);font-weight:700}
    .danger{background:var(--danger-soft);border-color:#fecaca;color:var(--danger);font-weight:700}
    .soft{background:var(--primary-soft);border-color:#bfdbfe;color:var(--primary);font-weight:700}
    .info{background:var(--info-soft);border-color:#99f6e4;color:var(--info);font-weight:700}
    label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
    input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:12px;background:#fff}
    textarea{min-height:96px;resize:vertical}
    .tilegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
    .tile{padding:14px;border:1px solid var(--border);border-radius:14px;background:#fff;cursor:pointer;text-align:left}
    .tile:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
    .badge,.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
    .badge{background:var(--primary-soft);color:var(--primary)}
    .pill.home{background:var(--ok-soft);color:var(--ok)}
    .pill.incarico{background:var(--warn-soft);color:var(--warn)}
    .pill.mine{background:var(--primary-soft);color:var(--primary)}
    .pill.sync{background:var(--info-soft);color:var(--info)}
    .pill.error{background:var(--danger-soft);color:var(--danger)}
    .pill.cantiere{background:#e0f2fe;color:#0369a1}
    .pill.magazzino{background:#ede9fe;color:#6d28d9}
    .article-list,.owned-list,.result-list{display:flex;flex-direction:column;gap:10px}
    .article,.owned-card,.result-card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:12px}
    .article{display:grid;grid-template-columns:34px 1.5fr 1fr 1fr 1fr auto;gap:10px;align-items:center}
    .article.selected{border-color:#93c5fd;background:#f8fbff}
    .alert{display:none;padding:12px 14px;border-radius:12px;margin-bottom:12px}
    .alert.show{display:block}
    .alert.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bbf7d0}
    .alert.error{background:var(--danger-soft);color:var(--danger);border:1px solid #fecaca}
    .alert.info{background:var(--info-soft);color:var(--info);border:1px solid #99f6e4}
    .toast-wrap{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1200;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(92vw,520px)}
    .toast{padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);background:#fff;opacity:0;transform:translateY(-8px);transition:all .18s ease}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.ok{background:var(--ok-soft);color:var(--ok);border-color:#bbf7d0}
    .toast.error{background:var(--danger-soft);color:var(--danger);border-color:#fecaca}
    .toast.info{background:var(--info-soft);color:var(--info);border-color:#99f6e4}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:12px;z-index:1000}
    .modal.open{display:flex}
    .modal-card{width:min(860px,100%);max-height:92vh;overflow:auto;padding:18px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
    .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.pinpad button{font-weight:800}
    .sidebar .nav{display:flex;flex-direction:column;gap:8px}.sidebar .nav button.active{background:var(--primary-soft);color:var(--primary);border-color:#bfdbfe;font-weight:700}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
    th{font-size:.8rem;text-transform:uppercase;color:var(--muted)}
    .sticky-bar{position:fixed;left:10px;right:10px;bottom:10px;z-index:900}
    .sticky-bar .actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .preview-img{max-width:100%;border-radius:12px;border:1px solid var(--border)}
    .empty{padding:16px;border:1px dashed var(--border);border-radius:14px;background:#fff}
    .stats{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
    .stat{border:1px solid var(--border);border-radius:14px;padding:14px;background:linear-gradient(180deg,#fff,#f8fbff)} .stat .value{font-size:1.6rem;font-weight:800;margin-top:6px}
    .progress-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:1400}
    .progress-overlay.show{display:flex}
    .progress-card{width:min(460px,100%);background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px}
    .progress-title{font-size:1.05rem;font-weight:800;margin:0 0 6px 0}
    .progress-sub{color:var(--muted);margin:0 0 12px 0}
    .progress-track{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}
    .progress-bar{height:100%;width:28%;background:linear-gradient(90deg,#60a5fa,#1d4ed8);border-radius:999px;transition:width .25s ease}
    .progress-steps{margin-top:12px;font-size:.9rem;color:var(--muted)}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.g4,.g3,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.article{grid-template-columns:34px 1fr 1fr}.article>:last-child{grid-column:2/-1}}
    @media(max-width:720px){.app{padding:10px;padding-bottom:110px}.g2,.g3,.g4,.stats{grid-template-columns:1fr}.actions,.modal-actions{flex-direction:column}.actions button,.modal-actions button{width:100%}.sticky-bar{left:8px;right:8px;bottom:8px;padding:10px}.sticky-bar .actions{grid-template-columns:repeat(2,minmax(0,1fr))}.article{grid-template-columns:28px 1fr}.article>div,.article>button{grid-column:2}.panel,.sidebar,.sticky-bar{padding:12px}table,thead,tbody,tr,th,td{display:block}thead{display:none}table{border-collapse:separate;border-spacing:0 8px}tbody tr{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:var(--shadow)}td{border:0;padding:5px 2px}td::before{content:attr(data-label);display:block;font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:3px}}
  </style>
</head>
<body>
<div id="toastWrap" class="toast-wrap"></div>
<div class="app" id="app"></div>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="progress-overlay" id="progressOverlay"><div class="progress-card"><div class="progress-title" id="progressTitle">Registrazione operazione...</div><p class="progress-sub" id="progressSub">Attendi qualche secondo.</p><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div><div class="progress-steps" id="progressSteps">Preparazione</div></div></div>

<script>
const SUPABASE_URL = "https://ytmvwotpniiortfagjbl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0bXZ3b3Rwbmlpb3J0ZmFnamJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NTAyNDQsImV4cCI6MjA5MDEyNjI0NH0.dPkJcQGjJaedpicj1QARqzJjrWyGnXAui8I80FQNozs";
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : {
 async rpc(name,args){
  const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),15000);
  try {
   const response=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+encodeURIComponent(name),{method:'POST',signal:controller.signal,headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
   const data=await response.json();
   return response.ok?{data}:{error:{message:data.message||'Servizio non disponibile.'}};
  } catch(e){return {error:{message:'Connessione non disponibile. I movimenti salvati rimangono sul dispositivo.'}};}
  finally {clearTimeout(timeout);}
 }
};

const SESSION_TIMEOUT_MINUTES=20;
let secureSession=null, pollingTimer=null, queueProcessing=false;
const OFFLINE_QUEUE_KEY="tracken_supabase_offline_queue_v1";
const OFFLINE_RETRY_MS = 5000;
let offlineRetryTimer = null;

let db = { users:[], locations:[], articles:[], movements:[] };
let currentUserId=null, currentLocationId=null, adminLogged=false, currentView="home", selectedArticleIds=[], lastActivityAt=null, currentSessionId=null, alertState=null;
let modalImageData=null, modalGeoState=null, geoAddressSyncInProgress=false, globalSearchTerm="", locationSearchTerm="", focusState=null, syncState="idle", lastScrollTop=0;
let rtChannel = null;

const $=s=>document.querySelector(s);

function uid(){ return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(36).slice(2,9)}`; }
function nowIso(){ return new Date().toISOString(); }
function formatDate(iso){ return iso ? new Date(iso).toLocaleString('it-IT') : '-'; }
function esc(v){ return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
async function api(action, body={}){
  const {data,error}=await sb.rpc('tracken_api',{p_action:action,p_token:secureSession?.token||null,p_body:body});
  if(error){ const e=new Error(error.message); e.network=!navigator.onLine || /fetch|network|Failed to fetch/i.test(error.message); throw e; }
  if(data?.error){ const e=new Error(data.error); e.business=true; if(data.auth_required) await logoutAll(false); throw e; }
  return data;
}
function safeImage(value){ return typeof value==='string' && value.length<=1500000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(value) ? value : ''; }
function expectedArticle(a){ return {state:a.state,holder:a.current_holder_user_id||null,location:a.location_id||null,last_movement_at:a.last_movement_at||null}; }
function sessionValid(){ return !!secureSession && Date.now()<Date.parse(secureSession.expires_at); }
async function acceptSession(result){
 secureSession=result; currentUserId=result.user.id; adminLogged=!!result.user.manager; currentView=adminLogged?'admin_dashboard':'home'; currentSessionId=uid(); touchSession();
 await fetchAllData(); subscribeRealtime(); render();
}
let authBusy=false;
async function submitAccess(action){
 if(authBusy) return;
 const name=$('#loginName').value.trim(), pin=$('#loginPin').value, code=$('#activationCode').value.trim();
 if(!name) return showAlert('error','Inserisci il nome utente, ad esempio SACHA.');
 if(!/^[0-9]{8,12}$/.test(pin)) return showAlert('error','Il PIN deve contenere da 8 a 12 cifre, solo numeri.');
 if(action==='activate' && !code) return showAlert('error','Inserisci il codice di attivazione ricevuto.');
 if(action==='login' && code) return showAlert('error','Per usare il codice premi Attiva accesso, sotto il codice.');
 authBusy=true;
 const buttons=[...document.querySelectorAll('#app button')];
 buttons.forEach(b=>b.disabled=true);
 showAlert('info','Verifica in corso…');
 try { await acceptSession(await api(action,{name,pin,...(action==='activate'?{code}:{})})); }
 catch(e){ showAlert('error',e.message); }
 finally { authBusy=false; buttons.forEach(b=>b.disabled=false); }
}
async function activateAccess(){ await submitAccess('activate'); }

function touchSession(){ lastActivityAt = nowIso(); }
function getOfflineQueue(){
  try{ return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || "[]"); }catch(e){ return []; }
}
function setOfflineQueue(queue){
  localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(queue));
}
function queueCount(){ return getOfflineQueue().length; }
function startOfflineRetryLoop(){
  stopOfflineRetryLoop();
  offlineRetryTimer = setInterval(async () => {
    if(!queueCount()) return;
    if(!navigator.onLine) return;
    await processOfflineQueue(false);
  }, OFFLINE_RETRY_MS);
}
function stopOfflineRetryLoop(){
  if(offlineRetryTimer){
    clearInterval(offlineRetryTimer);
    offlineRetryTimer = null;
  }
}
function queueOperation(op){
  const queue = getOfflineQueue();
  queue.push({ ...op, queued_at: nowIso(), local_id: uid() });
  setOfflineQueue(queue);
  renderSyncBadgeOnly();
  startOfflineRetryLoop();
}
function removeQueuedOperation(localId){
  const queue = getOfflineQueue().filter(op => op.local_id !== localId);
  setOfflineQueue(queue);
  renderSyncBadgeOnly();
  if(!queue.length) stopOfflineRetryLoop();
}
async function processOfflineQueue(showMessage=true){
  const queue = getOfflineQueue().filter(op=>op.recorded_by_user_id===currentUserId);
  if(!queue.length || !navigator.onLine || !sessionValid() || queueProcessing) return false;
  queueProcessing=true;

  syncState = "syncing";
  renderSyncBadgeOnly();
  showProgress('Sincronizzazione coda offline...', 'Sto inviando al database le operazioni salvate in locale.', `Coda offline: 0 / ${queue.length}`, 18);

  let processed = 0;
  try{
    for(const op of [...queue]){
      let ok = false;
      try{
        if(op.kind === 'movement' && op.operation_id && op.expected){
          updateProgress(`Coda offline: ${processed+1} / ${queue.length}`, Math.round(18 + ((processed+1)/queue.length)*60), 'Invio operazione al database.');
          ok = await commitMovementOperation(op, false, true);
        }
      }catch(err){
        console.error("QUEUE PROCESS ERROR:", err);
        ok = false;
      }

      if(ok){
        removeQueuedOperation(op.local_id);
        processed++;
      }else{
        break;
      }
    }

    syncState = "idle";
    renderSyncBadgeOnly();

    const remaining = queueCount();

    if(processed > 0){
      updateProgress('Aggiornamento dati locali', 92, 'Ricarico i dati più recenti.');
      await fetchAllData();
      render();
      if(showMessage) showAlert('ok', `${processed} operazioni offline sincronizzate.`);
    }

    if(remaining > 0){
      startOfflineRetryLoop();
    } else {
      stopOfflineRetryLoop();
    }

    return processed > 0;
  } finally {
    queueProcessing=false;
    setTimeout(hideProgress, 350);
  }
}
function sessionExpired(){ if(!lastActivityAt) return false; return (Date.now() - new Date(lastActivityAt).getTime()) > SESSION_TIMEOUT_MINUTES*60*1000; }
function ensureSession(){ if(secureSession && (!sessionValid() || sessionExpired())) logoutAll(false); }
async function logoutAll(notifyServer=true){
 const token=secureSession?.token; secureSession=null; stopOfflineRetryLoop(); clearInterval(pollingTimer); pollingTimer=null;
 currentUserId=null; currentLocationId=null; adminLogged=false; currentView='home'; selectedArticleIds=[]; currentSessionId=null; lastActivityAt=null; globalSearchTerm=''; db={users:[],locations:[],articles:[],movements:[]}; render();
 if(notifyServer && token) await sb.rpc('tracken_api',{p_action:'logout',p_token:token,p_body:{}});
}

function showToast(type,msg){
  const wrap = document.getElementById("toastWrap");
  if(!wrap) return;
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(()=>el.classList.add("show"));
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(),180); }, 1800);
}
function showAlert(type,msg){
  alertState = {type, message: msg};
  renderAlertOnly();
  showToast(type,msg);
  if(type!=='error') { const shown=alertState; setTimeout(()=>{ if(alertState===shown){ alertState=null; renderAlertOnly(); } }, 2200); }
}
function renderAlert(){ return !alertState ? '' : `<div class="alert show ${alertState.type}">${esc(alertState.message)}</div>`; }
function renderAlertOnly(){ const slot = document.getElementById("topAlertSlot"); if(slot) slot.innerHTML = renderAlert(); }
function showProgress(title='Registrazione operazione...', sub='Attendi qualche secondo.', step='Preparazione', value=18){
  const overlay = document.getElementById('progressOverlay');
  const t = document.getElementById('progressTitle');
  const s = document.getElementById('progressSub');
  const st = document.getElementById('progressSteps');
  const bar = document.getElementById('progressBar');
  if(t) t.textContent = title;
  if(s) s.textContent = sub;
  if(st) st.textContent = step;
  if(bar) bar.style.width = `${Math.max(8, Math.min(100, value))}%`;
  if(overlay) overlay.classList.add('show');
}
function updateProgress(step='Elaborazione', value=50, sub=null){
  const s = document.getElementById('progressSub');
  const st = document.getElementById('progressSteps');
  const bar = document.getElementById('progressBar');
  if(sub !== null && s) s.textContent = sub;
  if(st) st.textContent = step;
  if(bar) bar.style.width = `${Math.max(8, Math.min(100, value))}%`;
}
function hideProgress(){
  const overlay = document.getElementById('progressOverlay');
  if(overlay) overlay.classList.remove('show');
}

function renderTopbar(title,subtitle,extra=''){ return `<div class="top"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="actions">${extra}</div></div>`; }
function renderSyncBadge(){
  if(queueCount()>0) return `<span class="pill error">Offline queue: ${queueCount()}</span>`;
  if(syncState==='syncing') return `<span class="pill sync">Sincronizzazione...</span>`;
  if(!navigator.onLine) return `<span class="pill error">Offline</span>`;
  return `<span class="pill sync">Realtime attivo</span>`;
}
function renderSyncBadgeOnly(){ document.querySelectorAll('[data-sync-badge]').forEach(el=>el.innerHTML = renderSyncBadge()); }

function getUserName(id){ const u=db.users.find(x=>x.id===id); return u ? u.name : '-'; }
function getLocationName(id){ const l=db.locations.find(x=>x.id===id); return l ? l.name : '-'; }
function activeUsers(){ return db.users.filter(u=>u.active && (u.role==='user' || u.role==='admin')); }
function currentUserIsAdmin(){ const u=db.users.find(x=>x.id===currentUserId); return !!u && u.role==='admin'; }
function activeLocations(){ return db.locations.filter(l=>l.active); }
function activeArticlesForLocation(id){ return db.articles.filter(a=>a.active && a.location_id===id); }
function findArticle(id){ return db.articles.find(a=>a.id===id); }
function getOwnedArticles(){ return db.articles.filter(a=>a.active && a.current_holder_user_id===currentUserId); }
function isMine(a){ return !!currentUserId && a.current_holder_user_id===currentUserId; }

function statePill(a){
  const main = a.state==='home' ? `<span class="pill home">↓ Home</span>` : `<span class="pill incarico">↑ In carico</span>`;
  const mine = isMine(a) ? `<span class="pill mine">Lo hai tu</span>` : '';
  return main + (mine ? ` ${mine}` : '');
}
function movementLabel(type){ return {prelievo:'Prelievo',restituzione:'Restituzione',passaggio:'Passaggio',trasferimento:'Trasferimento'}[type] || type; }
function formatArticleCodes(a){
  const parts = [];
  if(a?.internal_code) parts.push(`Cod: ${a.internal_code}`);
  if(a?.serial) parts.push(`SN: ${a.serial}`);
  return parts.join(' • ') || '-';
}
function updateInputFocus(id, caret=null){
  const el = document.getElementById(id);
  if(!el) return;
  const pos = Math.min(caret ?? el.value.length, el.value.length);
  requestAnimationFrame(()=>{ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} });
}
function updateGlobalSearchUI(caret=null){
  const slot = document.getElementById('globalResultsSlot');
  if(slot) slot.innerHTML = globalSearchTerm ? renderGlobalSearchResults() : '';
  updateInputFocus('globalSearch', caret ?? globalSearchTerm.length);
}
function updateLocationArticleUI(caret=null){
  const list = document.getElementById('locationArticlesList');
  if(list && currentLocationId){
    const articles = activeArticlesForLocation(currentLocationId).sort((a,b)=>a.name.localeCompare(b.name));
    list.innerHTML = filterArticlesForUI(articles).map(renderArticleRow).join('') || `<div class="empty">Nessun articolo trovato.</div>`;
  }
  updateInputFocus('searchArticles', caret ?? locationSearchTerm.length);
}
function scrollToArticleRow(articleId){
  const row = document.getElementById(`articleRow_${articleId}`);
  if(row){
    row.scrollIntoView({ behavior:'smooth', block:'center' });
    row.classList.add('selected');
  }
}
function openArticleDetail(articleId, warning=''){
  const article = findArticle(articleId);
  if(!article) return;
  openModal(`
    <h3>Dettaglio articolo</h3>
    ${warning ? `<div class="alert show info" style="display:block">${esc(warning)}</div>` : ''}
    <div class="panel" style="margin:12px 0 0 0">

async function commitMovementOperation(op, refreshAfter=true, fromQueue=false){
 if(!sessionValid()) { showAlert('error','Accedi nuovamente per sincronizzare.'); return false; }
 if(op.recorded_by_user_id!==currentUserId) { showAlert('error','Operazione appartenente a un altro utente.'); return false; }
 syncState='syncing'; renderSyncBadgeOnly();
 try {
  if(!op.operation_id || !op.expected) throw Object.assign(new Error('Operazione precedente all’aggiornamento: ricreala dopo aver verificato lo storico.'),{business:true});
  const body={previous_operation:op.previous_operation||null,operation_id:op.operation_id,article_id:op.article_id,expected:op.expected,movement_type:op.movement_type,to_user_id:op.to_user_id,to_location_id:op.to_location_id,note:op.note,image_data:op.image_data,geo_lat:op.geo_lat,geo_lng:op.geo_lng,geo_accuracy_m:op.geo_accuracy_m,geo_captured_at:op.geo_captured_at,geo_address:op.geo_address};
  const result=await api('movement',body);
  if(result.article){ const a=db.articles.find(x=>x.id===result.article.id); if(a) Object.assign(a,result.article); }
  if(refreshAfter) { await fetchAllData(); render(); }
  syncState='idle'; return true;
 } catch(e){ syncState='error'; if(e.business){showAlert('error',e.message); return false;} throw e; }
 finally {hideProgress(); renderSyncBadgeOnly();}
}

async function saveMovementAndArticle(article, movement, articlePatch){
  const op = {
    kind:'movement',
    operation_id:uid(),
    expected:expectedArticle(article),
    previous_operation:getOfflineQueue().filter(x=>x.article_id===article.id && x.recorded_by_user_id===currentUserId).at(-1)?.operation_id||null,
    article_id: article.id,
    article_name: movement.article_name,
    article_serial: movement.article_serial || '',
    movement_type: movement.movement_type,
    from_location_id: movement.from_location_id,
    to_location_id: movement.to_location_id,
    from_user_id: movement.from_user_id,
    to_user_id: movement.to_user_id,
    recorded_by_user_id: movement.recorded_by_user_id,
    note: movement.note || '',
    image_data: movement.image_data || null,
    session_id: movement.session_id || '',
    geo_lat: movement.geo_lat ?? null,
    geo_lng: movement.geo_lng ?? null,
    geo_accuracy_m: movement.geo_accuracy_m ?? null,
    geo_captured_at: movement.geo_captured_at ?? null,
    geo_source: movement.geo_source || null,
    geo_address: movement.geo_address || null,
    article_patch: articlePatch
  };

  if(!sessionValid()){showAlert('error','Accedi nuovamente prima di registrare movimenti.');return false;}
  if(op.previous_operation){applyLocalMovementState(article.id,movement,articlePatch);queueOperation(op);render();return true;}
  try{
    const ok = await commitMovementOperation(op, true, false);
    if(ok) return true;
    return false;
  }catch(err){
    if(!sessionValid() || err.business || (!err.network && navigator.onLine)){ showAlert('error',err.message); return false; }
    console.warn("OFFLINE MODE ATTIVO:", err);
    showProgress('Registrazione offline...', 'Nessuna connessione disponibile.', 'Salvataggio in coda locale', 55);
    applyLocalMovementState(article.id, movement, articlePatch);
    queueOperation(op);
    updateProgress('Aggiornamento schermata', 100, 'Operazione salvata offline.');
    showAlert('info', 'Nessuna connessione. Operazione salvata offline.');
    render();
    return true;
  } finally {
    setTimeout(hideProgress, 350);
  }
}

async function compressImageFile(file, maxSide=1200, quality=0.7){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e=>{
      img.onload = ()=>{
        let {width,height}=img;
        const ratio = Math.min(1, maxSide / Math.max(width,height));
        const w = Math.round(width*ratio), h = Math.round(height*ratio);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function formatGeoPoint(lat,lng){
  if(lat==null || lng==null) return '-';
  return `${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}`;
}
function renderGeoStatus(){
  const el = document.getElementById('geoStatus');
  if(!el) return;
  if(!modalGeoState){
    el.innerHTML = `<span class="pill error">Posizione non richiesta</span>`;
    return;
  }
  if(modalGeoState.loading){
    el.innerHTML = `<span class="pill sync">Rilevazione posizione in corso...</span>`;
    return;
  }
  if(modalGeoState.ok){
    const accuracy = modalGeoState.accuracy != null ? ` • accuratezza ~${Math.round(modalGeoState.accuracy)} m` : '';
    const addressLine = modalGeoState.geo_address
      ? `<div class="small muted" style="margin-top:6px">${esc(modalGeoState.geo_address)}</div>`
      : modalGeoState.address_status==='offline_pending'
      ? `<div class="small muted" style="margin-top:6px">Indirizzo non disponibile offline. Verrà recuperato quando torni online.</div>`
      : modalGeoState.address_status==='lookup_failed'
      ? `<div class="small muted" style="margin-top:6px">Coordinate salvate. Indirizzo non recuperato: ${esc(modalGeoState.address_error || 'errore sconosciuto')}.</div>`
      : `<div class="small muted" style="margin-top:6px">Coordinate salvate. Recupero indirizzo in corso...</div>`;
    el.innerHTML = `<span class="pill sync">GPS acquisito</span><div class="small muted" style="margin-top:6px">${esc(formatGeoPoint(modalGeoState.lat, modalGeoState.lng))}${esc(accuracy)}</div>${addressLine}`;
    return;
  }
  el.innerHTML = `<span class="pill error">GPS non disponibile</span><div class="small muted" style="margin-top:6px">${esc(modalGeoState.error || 'Permesso negato o timeout.')}</div>`;
}
function safeGeoCapturedAt(rawTs){
  const now = Date.now();
  const candidates = [];
  if(typeof rawTs === 'number' && Number.isFinite(rawTs)) {
    candidates.push(rawTs);
    candidates.push(rawTs * 1000);
  }
  if(typeof rawTs === 'string' && rawTs.trim() !== '') {
    const n = Number(rawTs);
    if(Number.isFinite(n)) {
      candidates.push(n);
      candidates.push(n * 1000);
    }
  }

  const minOk = Date.UTC(2020, 0, 1);
  const maxOk = now + 24 * 60 * 60 * 1000;

  for(const candidate of candidates){
    const d = new Date(candidate);
    const t = d.getTime();
    if(Number.isFinite(t) && t >= minOk && t <= maxOk) return d.toISOString();
  }

  return new Date(now).toISOString();
}
async function getCurrentPositionAsync(options = {}){
  return new Promise((resolve) => {
    if(!navigator.geolocation){
      resolve({ ok:false, error:'Geolocalizzazione non supportata dal dispositivo/browser.' });
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({
        ok:true,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        captured_at: safeGeoCapturedAt(pos.timestamp),
        source:'browser_geolocation'
      }),
      (err) => resolve({ ok:false, error: err?.message || 'Impossibile ottenere la posizione.' }),
      {
        enableHighAccuracy: true,
        timeout: 8000,
        maximumAge: 15000,
        ...options
      }
    );
  });
}
async function reverseGeocodeAsync(lat, lng){
  if(lat == null || lng == null) return { ok:false, error:'Coordinate mancanti.' };
  if(!navigator.onLine) return { ok:false, error:'Nessuna connessione disponibile per ricavare l\'indirizzo.' };
  try{
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&zoom=18&addressdetails=1&accept-language=it`;
    const res = await fetch(url, {
      method:'GET',
      headers:{ 'Accept':'application/json' },
      cache:'no-store'
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const address = data?.display_name || null;
    if(!address) return { ok:false, error:'Indirizzo non trovato.' };
    return { ok:true, address, source:'reverse_geocoded_online' };
  }catch(err){
    console.warn('REVERSE GEOCODE ERROR:', err);
    return { ok:false, error: err?.message || 'Errore reverse geocoding.' };
  }
}
async function enrichGeoAddressForState(state){
  if(!state?.ok || state.lat == null || state.lng == null) return state;
  if(state.geo_address) return state;
  if(!navigator.onLine){
    return { ...state, geo_address:null, address_status:'offline_pending' };
  }
  const res = await reverseGeocodeAsync(state.lat, state.lng);
  if(res.ok){
    return {
      ...state,
      geo_address: res.address,
      address_status:'resolved',
      source: state.source || 'browser_geolocation'
    };
  }
  return {
    ...state,
    geo_address: null,
    address_status:'lookup_failed',
    address_error: res.error || 'Indirizzo non disponibile'
  };
}
async function captureMovementGeo(showToastOnError=false){
  modalGeoState = { loading:true };
  renderGeoStatus();
  const geo = await getCurrentPositionAsync();
  if(geo.ok){
    modalGeoState = { ...geo, loading:false };
    renderGeoStatus();
    const enriched = await enrichGeoAddressForState(modalGeoState);
    modalGeoState = { ...enriched, loading:false };
  }else{
    modalGeoState = { ok:false, loading:false, error:geo.error, source:'missing' };
    if(showToastOnError) showToast('info', 'GPS non disponibile: operazione salvata senza geotag.');
  }
  renderGeoStatus();
  return modalGeoState;
}

function render(){
  ensureSession();
  const searchBox = renderGlobalSearchBox();
  const results = globalSearchTerm ? renderGlobalSearchResults() : '';
  const app=$('#app');

  if(adminLogged){
    const body = currentView==='admin_users' ? renderAdminUsers()
      : currentView==='admin_locations' ? renderAdminLocations()
      : currentView==='admin_articles' ? renderAdminArticles()
      : currentView==='admin_logs' ? renderAdminLogs()
      : renderAdminDashboard();
    app.innerHTML = `<div class="layout">${renderAdminSidebar()}<div><div class="panel" style="margin-bottom:12px">${renderTopbar('Ricerca globale','Admin e operatori possono localizzare rapidamente un articolo', `<span data-sync-badge>${renderSyncBadge()}</span>`)}${searchBox}<div id="globalResultsSlot">${results}</div></div>${body}</div></div>`;
    restoreFocus();
    return;
  }
  if(!currentUserId){
    app.innerHTML = renderHome(searchBox, results);
    restoreFocus();
    return;
  }
  if(!currentLocationId){
    app.innerHTML = renderUserLanding(searchBox, results);
    restoreFocus();
    return;
  }
  app.innerHTML = `${renderUserArticles(searchBox, results)}${renderStickyActions()}`;
  restoreFocus();
}

async function confirmMovement(type){
  const note=$('#movementNote').value.trim(), targetUser=$('#targetUser')?.value||null, targetLocation=$('#targetLocation')?.value||null, articles=selectedArticleIds.map(findArticle).filter(Boolean);
  const userIsAdmin = currentUserIsAdmin();
  // GPS is optional and must never block recording inside a ship.
  if(type==='passaggio'&&!targetUser){ showAlert('error','Seleziona il collega destinatario.'); closeModal(); return; }
  if(type==='trasferimento'&&!targetLocation){ showAlert('error','Seleziona la sede di destinazione.'); closeModal(); return; }

  for(const a of articles){
    const heldByOther = a.current_holder_user_id && a.current_holder_user_id !== currentUserId;

    if(type==='prelievo'){
      if(a.state==='home'){
        // Prelievo standard consentito a tutti.
      }else if(a.state==='in_carico' && userIsAdmin){
        // Admin operativo: può prendere in carico un oggetto anche se era già assegnato ad altro utente.
      }else{
        showAlert('error',`Prelievo non consentito: ${a.name} non è disponibile in home.`); closeModal(); return;
      }
    }

    if(type==='restituzione'){
      if(a.state!=='in_carico'){
        showAlert('error',`Restituzione non consentita: ${a.name} risulta già in home.`); closeModal(); return;
      }
      if(heldByOther && !userIsAdmin){
        showAlert('error',`Restituzione non consentita: ${a.name} è in carico a ${getUserName(a.current_holder_user_id)}.`); closeModal(); return;
      }
    }

    if(type==='passaggio'){
      if(a.state!=='in_carico'){
        showAlert('error',`Passaggio non consentito: ${a.name} deve essere prima preso in carico.`); closeModal(); return;
      }
      if(heldByOther && !userIsAdmin){
        showAlert('error',`Passaggio non consentito: ${a.name} è in carico a ${getUserName(a.current_holder_user_id)}.`); closeModal(); return;
      }
    }

    if(type==='trasferimento'){
      if(a.state!=='home' && !userIsAdmin){
        showAlert('error',`Trasferimento non consentito: ${a.name} non è in home. Solo gli articoli in home possono essere spostati tra i cantieri.`); closeModal(); return;
      }
    }
  }

  for(const a of articles){
    const sourceHolder = a.current_holder_user_id || null;
    const transferKeepsHolder = type==='trasferimento' && a.state==='in_carico' && userIsAdmin;
    const movement = {
      article_id: a.id,
      article_name: a.name,
      article_serial: a.serial || '',
      movement_type: type,
      from_location_id: a.location_id,
      to_location_id: type==='trasferimento' ? targetLocation : a.location_id,
      from_user_id: sourceHolder,
      to_user_id: type==='prelievo' ? currentUserId : type==='passaggio' ? targetUser : transferKeepsHolder ? sourceHolder : null,
      recorded_by_user_id: currentUserId,
      note: note || '',
      image_data: modalImageData || null,
      session_id: currentSessionId || '',
      geo_lat: modalGeoState?.ok ? modalGeoState.lat : null,
      geo_lng: modalGeoState?.ok ? modalGeoState.lng : null,
      geo_accuracy_m: modalGeoState?.ok ? modalGeoState.accuracy : null,
      geo_captured_at: modalGeoState?.ok ? modalGeoState.captured_at : nowIso(),
      geo_source: modalGeoState?.ok ? (modalGeoState.source || 'browser_geolocation') : 'missing',
      geo_address: modalGeoState?.ok ? (modalGeoState.geo_address || null) : null
    };
    let patch = {};
    if(type==='prelievo') patch = { state:'in_carico', current_holder_user_id:currentUserId, last_known_user_id:currentUserId, last_movement_at:nowIso(), last_note:note||'' };
    if(type==='restituzione') patch = { state:'home', current_holder_user_id:null, last_movement_at:nowIso(), last_note:note||'' };
    if(type==='passaggio') patch = { state:'in_carico', current_holder_user_id:targetUser, last_known_user_id:targetUser, last_movement_at:nowIso(), last_note:note||'' };
    if(type==='trasferimento'){
      patch = transferKeepsHolder
        ? { location_id:targetLocation, state:'in_carico', current_holder_user_id:sourceHolder, last_known_user_id:sourceHolder, last_movement_at:nowIso(), last_note:note||'' }
        : { location_id:targetLocation, state:'home', current_holder_user_id:null, last_movement_at:nowIso(), last_note:note||'' };
    }
    const ok = await saveMovementAndArticle(a, movement, patch);
    if(!ok){ closeModal(); render(); return; }
    selectedArticleIds=selectedArticleIds.filter(id=>id!==a.id);
  }
  selectedArticleIds=[]; closeModal(); showAlert('ok', 'Movimento salvato sul dispositivo. Controlla lo stato nella coda.'); render();
}
